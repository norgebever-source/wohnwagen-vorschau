<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ein Bever-Film – Der Wohnwagen · norge-bever.blog (Vorschau)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f14">
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});
}
if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}
</script>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/aussen.jpg?v=11">
<link rel="stylesheet" href="style.v27.css">
</head>
<body class="phase-aussen">

<!-- Außen -->
<section id="aussen" aria-label="Vor dem Wohnwagen">
  <div class="viewport" id="vpA">
    <div class="stage" id="stageA">
      <img class="bg" src="img/aussen.jpg?v=11" alt="Wohnwagen am Fjord in der Abenddämmerung" draggable="false">
      <div class="glow"></div>
      <img class="tuer" id="tuer" src="img/tuer.png?v=11" alt="" draggable="false">
      <button class="hs door-hs" id="doorBtn" aria-label="Tür öffnen und eintreten"><span class="dot"></span><span class="lbl">Tür öffnen</span></button>
      <img class="schild schild-main" src="img/schild-fjord-fjellet.png?v=21" alt="" draggable="false">
      <button class="hs schild-hs" id="toFjord" style="left:34.85%;top:53.85%;width:9.05%;height:5.2%" aria-label="Til fjorden"><span class="dot"></span><span class="lbl">Til fjorden</span></button>
      <button class="hs schild-hs" id="toBerge" style="left:35.7%;top:59.45%;width:8.1%;height:5.2%" aria-label="Til fjellet"><span class="dot"></span><span class="lbl">Til fjellet</span></button>
    </div>
  </div>
  <div class="hint" id="hintA">← wischen zum Umsehen →</div>
  <div class="caption">
    <p class="kicker">Kapitel 1 · Am Fjord</p>
    <h2>Norwegen mit Wohnwagen</h2>
    <p>echte Tipps von echten Reisenden</p>
    <button class="cta" id="enter">Eintreten ›<span class="dot"></span></button>
  </div>
</section>

<!-- Blick zum Fjord -->
<section id="fjord" aria-label="Blick zum Fjord">
  <div class="viewport" id="vpF">
    <div class="stage stage-view" id="stageF">
      <img class="bg" src="img/aussen-fjord.jpg?v=15" alt="Blick zum Fjord in der Abenddämmerung" draggable="false">
      <img class="spot-img spot-fish" src="img/fish.png?v=22" alt="" draggable="false">
      <img class="schild schild-back-fjord" src="img/schild-camping-rechts.png?v=12" alt="" draggable="false">
      <button class="hs schild-hs" id="fromFjord" style="left:37.8%;top:39.4%;width:16.2%;height:9%" aria-label="Til campingvogna"><span class="dot"></span><span class="lbl">Til campingvogna</span></button>
      <img class="spot-img spot-angel" src="img/angel.png?v=20" alt="" draggable="false">
      <div class="spot-img spot-windsack" aria-hidden="true">
        <img class="windsack-mast" src="img/windsack-mast.png?v=24" alt="" draggable="false">
        <img class="windsack-sack" src="img/windsack-sack.png?v=24" alt="" draggable="false">
      </div>
      <button class="spot" id="spotFish" style="left:63.2%;top:63.2%;width:6.7%;height:5.26%" aria-label="Norgeskart öffnen"><span class="dot"></span><span class="spot-lbl">Norgeskart öffnen</span></button>
      <button class="spot" id="spotAngel" style="left:48.18%;top:50.19%;width:4.7%;height:24.48%" aria-label="Angel-Apps"><span class="dot"></span><span class="spot-lbl">Angel-Apps</span></button>
      <button class="spot" id="spotWindsack" style="left:55.52%;top:22.09%;width:5.41%;height:8.2%" aria-label="Wind &amp; Wetter"><span class="dot"></span><span class="spot-lbl">Wind &amp; Wetter</span></button>
    </div>
  </div>
  <button type="button" class="photo-x" id="closeFjord" aria-label="Foto schließen">✕</button>
  <div id="spotPop" hidden>
    <div class="spot-card">
      <button type="button" class="spot-x" aria-label="Schließen">✕</button>
      <div id="spotLinks" class="spot-links"></div>
    </div>
  </div>
</section>

<!-- Blick zu den Bergen -->
<section id="berge" aria-label="Blick zu den Bergen">
  <div class="viewport" id="vpB">
    <div class="stage stage-view" id="stageB">
      <img class="bg" src="img/aussen-berge.jpg?v=15" alt="Blick zu den Bergen in der Abenddämmerung" draggable="false">
      <img class="schild schild-back-berge" src="img/schild-camping-links.png?v=12" alt="" draggable="false">
      <button class="hs schild-hs" id="fromBerge" style="left:47.8%;top:42.5%;width:17.2%;height:10.3%" aria-label="Til campingvogna"><span class="dot"></span><span class="lbl">Til campingvogna</span></button>
    </div>
  </div>
  <button type="button" class="photo-x" id="closeBerge" aria-label="Foto schließen">✕</button>
</section>

<!-- Innen -->
<section id="innen" aria-label="Im Wohnwagen">
  <div class="viewport scroller" id="vpI">
    <div class="stage" id="stageI">
      <img class="bg" src="img/innen.jpg?v=11" alt="Gemütlicher Wohnwagen von innen" draggable="false">
      <div class="lamp"></div>
      <!-- Hotspots: Prozent der Bildfläche -->
      <button class="hs" data-st="fenster"  style="left:1.5%;top:2%;width:15.1%;height:55%"><span class="dot"></span><span class="lbl">Fenster · Reisebilder</span></button>
      <button class="hs" data-st="tv"       style="left:16.6%;top:31%;width:20.5%;height:29.5%"><span class="dot"></span><span class="lbl">Fernseher · Video</span></button>
      <button class="hs fr" data-st="wir" data-photo="0" style="left:37.6%;top:14.8%;width:9.7%;height:19.6%"><span class="dot"></span><span class="lbl">Wohnwagen &amp; wir</span></button>
      <button class="hs fr" data-st="rahmen"   style="left:47.9%;top:14.8%;width:9.7%;height:19.6%"><span class="dot"></span><span class="lbl">Galerien</span></button>
      <button class="hs fr" data-st="wir" data-photo="1" style="left:58.2%;top:14.8%;width:9.7%;height:19.6%"><span class="dot"></span><span class="lbl">Wohnwagen &amp; wir</span></button>
      <button class="hs" data-st="platte"   style="left:66%;top:40.5%;width:11%;height:10%"><span class="dot"></span><span class="lbl">Plattenspieler · Musik</span></button>
      <button class="hs" data-st="radio"    style="left:77.2%;top:42.8%;width:10.2%;height:12%"><span class="dot"></span><span class="lbl">Radio · Live</span></button>
      <button class="hs" data-st="schublade" style="left:67%;top:55%;width:17%;height:42%"><span class="dot"></span><span class="lbl">Schubladen</span></button>
      <button class="hs" data-st="ordner"   style="left:87.5%;top:0%;width:12.5%;height:26%"><span class="dot"></span><span class="lbl">Ordner · Norwegen-Infos</span></button>
      <button class="hs" data-st="karte"    style="left:87.5%;top:32.5%;width:12.5%;height:12%"><span class="dot"></span><span class="lbl">Karte · Route 2026</span></button>
      <button class="hs" data-st="kompass"  style="left:87.8%;top:48%;width:12.2%;height:16%"><span class="dot"></span><span class="lbl">Kompass · Svingen-App</span></button>
      <!-- Kleine Bilder: Wohnwagen und wir -->
    </div>
  </div>
  <div class="hint" id="hint">← wischen zum Umsehen →</div>
  <nav class="dock" aria-label="Stationen">
    <button data-st="fenster">🪟<span>Fenster</span></button>
    <button data-st="tv">📺<span>TV</span></button>
    <button data-st="rahmen">🖼️<span>Galerien</span></button>
    <button data-st="platte">🎵<span>Musik</span></button>
    <button data-st="schublade">🗄️<span>Schubladen</span></button>
    <button data-st="ordner">📁<span>Infos</span></button>
    <button data-st="kompass">🧭<span>Svingen</span></button>
    <button data-st="wir">👪<span>Wir</span></button>
  </nav>
  <button id="out" class="ghost top-left" aria-label="Wieder nach draußen">‹ Nach draußen</button>
</section>

<!-- Overlay -->
<div id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle" hidden>
  <div class="panel">
    <header><button id="back" class="back">‹ Zurück in den Wohnwagen</button></header>
    <h2 id="ovTitle"></h2>
    <div id="ovBody"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb" hidden><button class="x" aria-label="Schließen">✕</button><button class="nav prev" aria-label="Zurück">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="nav next" aria-label="Weiter">›</button></div>

<div class="fx vignette"></div><div class="fx grain"></div><div id="flash" class="fx"></div>
<button id="sound" class="ghost top-right" aria-pressed="false" title="Umgebungsgeräusche">🔇 Ton aus</button>
<audio id="musik" src="musik.mp3?v=8" preload="none" loop></audio>
<p class="proto">Vorschau · Prototyp · Inhalte von norge-bever.blog</p>

<script src="data.js?v=8"></script>
<script src="app.v27.js"></script>
</body>
</html>
